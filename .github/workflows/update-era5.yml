
name: Update Anar ERA5

on:
  schedule:
    - cron: "17 7 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install libraries
        run: |
          python -m pip install --upgrade cdsapi eccodes jdatetime

      - name: Download ERA5-Land
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: python tool/update_era5.py

      - name: Save updated weather data
        run: |
          if [ ! -f data/anar_latest.csv ]; then
            echo "No complete ERA5 data available"
            exit 0
          fi

          git config user.name "weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/anar_latest.csv

          if ! git diff --cached --quiet; then
            git commit -m "Update Anar weather data"
            git push
          fi
